<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calcolatore Watt Volt Ampere | CalcQuantum</title>
<style>
body{font-family:system-ui;margin:32px;max-width:720px}
label{display:block;margin:14px 0 6px;font-weight:600}
input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
button{margin-top:20px;background:#111;color:#fff}
.note{color:#666;font-size:14px;margin:8px 0 18px}
.calc{opacity:.55}
.result{margin-top:22px;padding:18px;border:1px solid #ddd;border-radius:12px}
</style>
</head>
<body>
<h1>Calcolatore Watt / Volt / Ampere</h1>
<p class="note">Inserisci due valori. Il terzo viene calcolato automaticamente.</p>

<label>Calcolare</label>
<select id="mode" onchange="ui()">
  <option value="P">Potenza (W)</option>
  <option value="V">Tensione (V)</option>
  <option value="I">Corrente (A)</option>
</select>

<div id="fp">
<label>Potenza (W)</label>
<input id="p" type="number" step="0.01">
</div>

<div id="fv">
<label>Tensione (V)</label>
<input id="v" type="number" step="0.01">
</div>

<div id="fi">
<label>Corrente (A)</label>
<input id="i" type="number" step="0.01">
</div>

<button onclick="calc()">Calcola risultato</button>

<div class="result" id="out">Seleziona la grandezza da calcolare.</div>

<script>
function ui(){
  const m=mode.value;
  [['P','fp','p'],['V','fv','v'],['I','fi','i']].forEach(([k,box,id])=>{
    const calc=k===m;
    document.getElementById(box).className=calc?'calc':'';
    document.getElementById(id).disabled=calc;
    if(calc) document.getElementById(id).value='';
  });
}
function n(id){return Number(document.getElementById(id).value);}
function calc(){
  const m=mode.value;
  let r='';
  if(m==='P'){
    const V=n('v'),I=n('i');
    if(V<=0||I<=0){out.innerHTML='Inserisci tensione e corrente.';return;}
    r=`<h2>${(V*I).toFixed(2)} W</h2><p>Formula: P = V × I</p>`;
  }else if(m==='V'){
    const P=n('p'),I=n('i');
    if(P<=0||I<=0){out.innerHTML='Inserisci potenza e corrente.';return;}
    r=`<h2>${(P/I).toFixed(2)} V</h2><p>Formula: V = P ÷ I</p>`;
  }else{
    const P=n('p'),V=n('v');
    if(P<=0||V<=0){out.innerHTML='Inserisci potenza e tensione.';return;}
    r=`<h2>${(P/V).toFixed(2)} A</h2><p>Formula: I = P ÷ V</p>`;
  }
  out.innerHTML=r;
}
ui();
</script>
</body>
</html>
